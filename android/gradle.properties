# This machine has 7.9 GB of RAM. The template value shipped here was
# -Xmx8G -XX:MaxMetaspaceSize=4G, i.e. more than the physical memory, which
# crashed the Gradle daemon with "Native memory allocation (mmap) failed".
# These values build fine and leave room for the Kotlin daemon and the IDE.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation fails to close its memory-mapped .tab caches on
# this Windows setup ("Could not close incremental caches" on every Kotlin plugin
# module). Verified independent of the heap-size problem above: it reproduces on
# a clean build with a healthy daemon. Full recompiles are slower but complete.
kotlin.incremental=false
