name: elira
description: ASC Photo AI - Edit. Enhance. Create.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  google_fonts: ^6.2.1

  # Photo / Image
  image: ^4.9.2
  image_picker: ^1.1.2
  photo_manager: ^3.4.3
  photo_manager_image_provider: ^2.2.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # Storage
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

  # Firebase
  firebase_core: ^3.14.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7
  firebase_analytics: ^11.4.5

  # UI / Animation
  flutter_svg: ^2.0.17
  lottie: ^3.3.1

  # Export / Share
  share_plus: ^10.1.4
  http: ^1.6.0
  permission_handler: ^11.4.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/png/img_logo_app.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/png/
